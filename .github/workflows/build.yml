name: Build APK
on:
  push:
    paths:
      - 'ZeroScriptStudio-App-src.zip'
      - '.github/workflows/build.yml'
      - 'mobile-overrides/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive if present
        run: |
          if [ -f ZeroScriptStudio-App-src.zip ]; then
            unzip -oq ZeroScriptStudio-App-src.zip -d /tmp/zeroscript-src
            cp -a /tmp/zeroscript-src/. .
          fi
      - name: Apply mobile UI and launcher icon changes
        run: python3 mobile-overrides/patch_android.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroScriptStudio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ZeroScriptStudio APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
